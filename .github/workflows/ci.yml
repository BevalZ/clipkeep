name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci
      - name: Check and build frontend
        working-directory: ui
        run: npm run build
      - name: Check Rust formatting
        working-directory: native
        run: cargo fmt --all -- --check
      - name: Test Rust
        working-directory: native
        run: cargo test --locked
      - name: Lint Rust
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings

  storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check portable storage and protocol tests
        run: |
          cargo fmt --manifest-path native/core-tests/Cargo.toml --all -- --check
          cargo test --manifest-path native/core-tests/Cargo.toml --locked
          cargo clippy --manifest-path native/core-tests/Cargo.toml --locked --all-targets -- -D warnings

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Android
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clipkeep-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
