name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: python3 scripts/release.py version >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
          - os: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: npm --prefix ui ci
      - name: Build frontend for Rust checks
        run: npm --prefix ui run build
      - name: Check desktop
        working-directory: native
        run: |
          cargo fmt --all -- --check
          cargo test --locked --target ${{ matrix.target }}
          cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Package desktop
        working-directory: native
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # Ad-hoc signing supports Apple Silicon without claiming Developer ID notarization.
          APPLE_SIGNING_IDENTITY: '-'
        run: node ../ui/node_modules/@tauri-apps/cli/tauri.js build --target ${{ matrix.target }} -- --locked
      - name: Collect desktop installers
        run: python3 scripts/release.py collect --target ${{ matrix.target }} --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'clipkeep-release.jks'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          path.chmod(0o600)
          PY
      - name: Test and sign Android release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/clipkeep-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:bundleRelease
      - name: Verify signing identity and collect APK and bundle
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee apk-signature.txt
          grep -F '1acac42eccdc8cd63b98d86a4fb5831e6637fbeabd71c81d8fecf6442c1385ee' apk-signature.txt
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
          mkdir release-assets
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/clipkeep-${VERSION}-android.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-assets/clipkeep-${VERSION}-android.aab"
          cp apk-signature.txt release-assets/android-signature.txt
      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/clipkeep-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified artifacts and immutable version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release.py publish
