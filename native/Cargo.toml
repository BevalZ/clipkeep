[package]
name = "clipkeep"
version = "0.2.0"
description = "clipkeep - clipboard history & favorites"
authors = ["clipkeep contributors"]
edition = "2024"
license = "MIT"

[lib]
# Keep the library name distinct from the desktop executable.
name = "clipkeep_lib"
# Desktop-only: mobile crate types are unnecessary.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.3"
arboard = "3.6.1"
clipboard-master = "4.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
blake3 = "1.5"
tauri-plugin-dialog = "2.8.2"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
getrandom = "0.4.3"
local-ip-address = "0.6.13"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-global-shortcut = "2.4.1"
enigo = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["protocol-asset"] }

[profile.release]
codegen-units = 1
# Fat LTO ("true") crashes rustc 1.99 here with STATUS_ACCESS_VIOLATION; thin is nearly as small.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
