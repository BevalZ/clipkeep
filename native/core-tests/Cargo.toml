[package]
name = "clipkeep-core-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
blake3 = "1.5"
base64 = "0.23.1"
getrandom = "0.4.3"
tempfile = "3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
chacha20poly1305 = "0.11.0"
